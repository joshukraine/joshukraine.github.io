      :root {

      /* Reset: only the browser defaults this page would otherwise pick up. */
      html {

      @media (hover: hover) and (prefers-reduced-motion: no-preference) {

      /* Lightbox: a full-viewport modal <dialog>. The browser supplies the
         inert page, focus containment, Esc/back-gesture dismissal, and focus
         return to the thumbnail that opened it. */
      #lightbox {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background-color: #0e0e0e;
        color: #fff;
      }
      /* Scoped to [open]: setting display on dialog unconditionally would
         override the closed state and leave it visible. */
      #lightbox[open] {
        display: grid;
        grid-template-rows: 1fr;
      }
      /* Stop scroll gestures over or inside the dialog from scrolling the page
         behind it -- without touching overflow on html/body. */
      #lightbox:modal {
        overscroll-behavior: contain;
      }
      #lightbox::backdrop {
        background: transparent;
        overflow: hidden;
        overscroll-behavior: contain;
      }
      /* Entry fade only. An exit fade needs `overlay` and discrete `display`
         transitions, which Safari and Firefox lack, plus a JS close fallback;
         an instant close is not worth that code. */
      #lightbox[open] {
        opacity: 1;
        transition: opacity 0.2s ease-out;
        @starting-style {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #lightbox[open] {
          transition-duration: 0.1s;
        }
      }

      .lb-stage {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 3.5rem 0.75rem;
        /* Vertical pans and pinch-zoom stay native; horizontal swipes reach
           the pointer handlers for prev/next. */
        touch-action: pan-y pinch-zoom;
      }
      .lb-stage img {
        /* Explicit viewport math: a percentage max-height does not resolve
           against an auto-height grid row. 7rem/8rem = the stage padding. */
        max-height: calc(100dvh - 7rem);
        width: auto;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      @media (min-width: 640px) {

        }

        }
      }

      .lb-button {
        position: absolute;
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 9999px;
        background-color: rgb(255 255 255 / 0.08);
        color: #fff;
        cursor: pointer;
        touch-action: manipulation;
      }
      .lb-button:hover {
        background-color: rgb(255 255 255 / 0.18);
      }
      .lb-button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .lb-button svg {
        width: 1.25rem;
        height: 1.25rem;
      }
      .lb-close {
        top: 0.75rem;
        right: 0.75rem;
      }
      .lb-prev,
      .lb-next {
        top: 50%;
        translate: 0 -50%;
      }
      .lb-prev {
        left: 0.75rem;
      }
      .lb-next {
        right: 0.75rem;
      }
      /* On narrow screens the arrows move to the bottom bar so they never
         cover the photo; swiping is the primary gesture there. */
      @media (max-width: 639px) {
        .lb-prev,
        .lb-next {
          top: auto;
          bottom: 0.5rem;
          translate: none;
        }
      }
      /* Slide between photos (View Transitions). The outgoing and incoming
         photos get separate transition names (set in the script), so each
         slides on its own instead of morphing between portrait and landscape
         sizes. With reduced motion these rules never apply and the browser's
         default crossfade runs instead. */
      @media (prefers-reduced-motion: no-preference) {
        html:active-view-transition-type(forward) {
          &::view-transition-old(lb-old) {
            animation: lb-slide-out-left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
          }
          &::view-transition-new(lb-new) {
            animation: lb-slide-in-right 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
          }
        }
        html:active-view-transition-type(backward) {
          &::view-transition-old(lb-old) {
            animation: lb-slide-out-right 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
          }
          &::view-transition-new(lb-new) {
            animation: lb-slide-in-left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
          }
        }
      }
      @keyframes lb-slide-out-left {
        to { translate: -100vw 0; }
      }
      @keyframes lb-slide-in-right {
        from { translate: 100vw 0; }
      }
      @keyframes lb-slide-out-right {
        to { translate: 100vw 0; }
      }
      @keyframes lb-slide-in-left {
        from { translate: -100vw 0; }
      }

        left: 50%;
        translate: -50% 0;
        font-size: 0.75rem;
        letter-spacing: 0.25em;

    <dialog id="lightbox" aria-label="Photo viewer">
      <div class="lb-stage"></div>
      <p class="lb-count" aria-live="polite"></p>
      <form method="dialog">
        <button class="lb-button lb-close" aria-label="Close" autofocus>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </form>
      <button type="button" class="lb-button lb-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" />
        </svg>
      </button>
      <button type="button" class="lb-button lb-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </dialog>

    <script>
      // Progressive enhancement: every thumbnail is a plain link to the large
      // image, so the gallery works without this script. With it, links open
      // in the lightbox instead.
      (() => {
        const CLOUDINARY = "https://res.cloudinary.com/dnkvsijzu/image/upload";
        const WIDTHS = [1200, 1800, 2400];
        const links = [...document.querySelectorAll(".gallery a[data-photo]")];
        const dialog = document.getElementById("lightbox");
        const stage = dialog.querySelector(".lb-stage");
        const count = dialog.querySelector(".lb-count");
        let index = 0;

        const url = (id, w) => `${CLOUDINARY}/f_auto,q_auto,w_${w},c_limit/abbie-axel/${id}`;

        function buildImage(i) {
          const link = links[i];
          const id = link.dataset.photo;
          const img = new Image();
          img.width = link.dataset.width;
          img.height = link.dataset.height;
          img.sizes = "100vw";
          img.srcset = WIDTHS.map((w) => `${url(id, w)} ${w}w`).join(", ");
          img.src = url(id, 1800);
          img.alt = link.querySelector("img").alt;
          return img;
        }

        // Directional slides need View Transitions *with* transition types;
        // without both, photos swap instantly as before.
        const canSlide =
          typeof document.startViewTransition === "function" &&
          "ViewTransition" in window &&
          "types" in ViewTransition.prototype;

        // dir: 1 = next, -1 = previous, 0 = no slide (opening the lightbox).
        async function show(i, dir = 0) {
          index = (i + links.length) % links.length;
          const current = index;
          const img = buildImage(current);
          count.textContent = `${current + 1} of ${links.length}`;
          // Swap only once decoded, so navigating never flashes a blank stage.
          try {
            await img.decode();
          } catch {
            // Decode can reject for reasons that still let the image render.
          }
          if (current !== index) return; // a newer navigation won the race
          const previous = stage.querySelector("img");
          if (dir && previous && canSlide) {
            previous.style.viewTransitionName = "lb-old";
            img.style.viewTransitionName = "lb-new";
            document.startViewTransition({
              update: () => stage.replaceChildren(img),
              types: [dir > 0 ? "forward" : "backward"],
            });
          } else {
            stage.replaceChildren(img);
          }
          // Warm the neighbours so prev/next feel instant.
          buildImage((current + 1) % links.length);
          buildImage((current - 1 + links.length) % links.length);
        }

        links.forEach((link, i) => {
          link.addEventListener("click", (event) => {
            // Leave modified clicks (new tab/window) to the browser.
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            show(i);
            dialog.showModal();
          });
        });

        dialog.querySelector(".lb-prev").addEventListener("click", () => show(index - 1, -1));
        dialog.querySelector(".lb-next").addEventListener("click", () => show(index + 1, 1));

        dialog.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft") show(index - 1, -1);
          else if (event.key === "ArrowRight") show(index + 1, 1);
        });

        // Empty the stage on close so reopening on another photo never flashes
        // the previous one while the new image decodes.
        dialog.addEventListener("close", () => stage.replaceChildren());

        // The dialog fills the viewport, so there is no visible backdrop to
        // light-dismiss against; a click on the empty space around the photo
        // closes it instead.
        dialog.addEventListener("click", (event) => {
          // A click right after a swipe is the swipe's own tail, not a dismissal.
          // Time-boxed rather than a flag, since browsers often fire no click
          // at all after a long touch move -- a flag would then eat the next tap.
          if (performance.now() - lastSwipe < 400) return;
          if (event.target === dialog || event.target === stage) dialog.close();
        });

        // Horizontal swipe on touch screens.
        let startX = null;
        let startY = null;
        let lastSwipe = -Infinity;
        stage.addEventListener("pointerdown", (event) => {
          if (event.pointerType !== "touch") return;
          startX = event.clientX;
          startY = event.clientY;
        });
        stage.addEventListener("pointerup", (event) => {
          if (startX === null) return;
          const dx = event.clientX - startX;
          const dy = event.clientY - startY;
          startX = startY = null;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
            lastSwipe = performance.now();
            const dir = dx < 0 ? 1 : -1;
            show(index + dir, dir);
          }
        });
        stage.addEventListener("pointercancel", () => {
          startX = startY = null;
        });
      })();
    </script>
